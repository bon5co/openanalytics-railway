# Fronting proxy for the public roles. Open Analytics trusts X-Real-IP and the client-identity headers below
# because upstream always runs behind its own Caddy, which strips them. Railway's edge strips none of them and
# sends X-Forwarded-For as "<client>, <edge>" with a rotating edge hop, so this proxy deletes every identity
# header a visitor could set and writes X-Real-IP from the first address of X-Forwarded-For.
pid /tmp/oa-nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_for $oa_client_ip { default $remote_addr; '~^\s*([^,\s]+)' $1; }
  server {
    listen __LISTEN_PORT__;
    listen [::]:__LISTEN_PORT__;
    client_max_body_size 8m;
    # Better Auth mounts an open email sign-up on the api. The first account is created by the entrypoint and the
    # instance is single-operator, so the door is closed here.
    location ~ ^/api/auth/sign-up { return 403 '{"code":"SIGNUP_CLOSED","message":"Sign-up is closed on this deployment."}'; default_type application/json; }
    location / {
      proxy_pass http://127.0.0.1:__APP_PORT__;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Real-IP $oa_client_ip;
      proxy_set_header X-Forwarded-For $oa_client_ip;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Fly-Client-IP "";
      proxy_set_header True-Client-IP "";
      proxy_set_header CF-IPCountry "";
      proxy_set_header CF-IPCity "";
      proxy_set_header CF-IPLatitude "";
      proxy_set_header CF-IPLongitude "";
      proxy_set_header CF-Region "";
      proxy_set_header Fly-Client-Country "";
      proxy_set_header X-Vercel-IP-City "";
      proxy_set_header X-Vercel-IP-Country "";
      proxy_set_header X-Forwarded-Host "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
